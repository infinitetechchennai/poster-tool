<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: {{ width }}px;
      height: {{ height }}px;
      background: #0a0f1d;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 80px;
      position: relative;
    }
    /* Subtle decorative background grid and glow */
    .bg-glow {
      position: absolute;
      top: -150px;
      right: -150px;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(14, 165, 233, 0) 70%);
      pointer-events: none;
    }
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    /* Header Area */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }
    .kicker-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 9999px;
      color: #38bdf8;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .kicker-dot {
      width: 8px;
      height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8;
    }
    .brand-logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-logo span { color: #38bdf8; }

    /* Main Content */
    .main-content {
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 28px;
      margin: auto 0;
    }
    .poster-title {
      font-size: {{ title_font_size }}px;
      font-weight: 800;
      line-height: 1.15;
      color: #ffffff;
      letter-spacing: -1px;
      max-width: 950px;
    }
    .poster-desc {
      font-size: 24px;
      line-height: 1.5;
      color: #94a3b8;
      max-width: 900px;
      font-weight: 400;
    }
    /* Bullets Grid */
    .bullets-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 10px;
    }
    .bullet-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 24px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      backdrop-filter: blur(10px);
    }
    .bullet-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      background: #0284c7;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }
    .bullet-text {
      font-size: 20px;
      font-weight: 500;
      color: #e2e8f0;
      line-height: 1.35;
    }

    /* Footer & CTA */
    .footer-bar {
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: #0284c7;
      color: #ffffff;
      padding: 18px 36px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.4);
    }
    .footer-meta {
      font-size: 14px;
      color: #64748b;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <div class="header-bar">
    <div class="kicker-badge">
      <div class="kicker-dot"></div>
      {{ header }}
    </div>
    <div class="brand-logo">InfiniteTech<span>AI</span></div>
  </div>

  <div class="main-content">
    <h1 class="poster-title">{{ title }}</h1>
    <p class="poster-desc">{{ description }}</p>

    <div class="bullets-container">
      {% for bullet in bullet_points %}
      <div class="bullet-card">
        <div class="bullet-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="bullet-text">{{ bullet }}</div>
      </div>
      {% endfor %}
    </div>
  </div>

  <div class="footer-bar">
    <div class="cta-button">
      {{ call_to_action }}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </div>
    <div class="footer-meta">Enterprise Solutions &bull; www.infinitetechai.com</div>
  </div>
</body>
</html>
