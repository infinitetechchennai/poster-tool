<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: {{ width }}px;
      height: {{ height }}px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 80px;
      position: relative;
    }
    /* Vibrant multi-color gradient ambient lights */
    .glow-cyan {
      position: absolute;
      top: -120px;
      left: -120px;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, rgba(6, 182, 212, 0) 70%);
      pointer-events: none;
    }
    .glow-purple {
      position: absolute;
      bottom: -150px;
      right: -150px;
      width: 750px;
      height: 750px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, rgba(168, 85, 247, 0) 70%);
      pointer-events: none;
    }
    /* Glassmorphic border frame */
    .content-box {
      z-index: 2;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 48px 56px;
      backdrop-filter: blur(24px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin: auto 0;
    }
    /* Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }
    .kicker {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #22d3ee, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-mark {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .brand-mark span { color: #a855f7; }

    /* Typography */
    .poster-title {
      font-size: {{ title_font_size }}px;
      font-weight: 800;
      line-height: 1.15;
      color: #ffffff;
      letter-spacing: -1px;
    }
    .poster-desc {
      font-size: 23px;
      line-height: 1.5;
      color: #cbd5e1;
      font-weight: 400;
    }
    /* Bullets */
    .bullets-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 6px;
    }
    .bullet-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.04);
      border-left: 3px solid #22d3ee;
      border-radius: 0 10px 10px 0;
    }
    .bullet-row:nth-child(even) {
      border-left-color: #a855f7;
    }
    .bullet-text {
      font-size: 19px;
      font-weight: 500;
      color: #f8fafc;
      line-height: 1.35;
    }

    /* Footer */
    .footer-bar {
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);
      color: #ffffff;
      padding: 18px 36px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 12px 30px -5px rgba(139, 92, 246, 0.4);
    }
    .footer-note {
      font-size: 15px;
      color: #94a3b8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="glow-cyan"></div>
  <div class="glow-purple"></div>

  <div class="header-bar">
    <div class="kicker">{{ header }}</div>
    <div class="brand-mark">INFINITETECH<span>AI</span></div>
  </div>

  <div class="content-box">
    <h1 class="poster-title">{{ title }}</h1>
    <p class="poster-desc">{{ description }}</p>

    <div class="bullets-container">
      {% for bullet in bullet_points %}
      <div class="bullet-row">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <div class="bullet-text">{{ bullet }}</div>
      </div>
      {% endfor %}
    </div>
  </div>

  <div class="footer-bar">
    <div class="cta-button">
      {{ call_to_action }}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </div>
    <div class="footer-note">Scalable Architecture &bull; Verified AI Systems</div>
  </div>
</body>
</html>
