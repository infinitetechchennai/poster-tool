<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Anton&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --brand-teal: #0fa5a6;
      --brand-teal-dark: #0c8283;
      --brand-teal-light: #38bdf8;
      --brand-slate: #0f172a;
      --brand-text-muted: #475569;
      --pill-bg: rgba(255, 255, 255, 0.95);
      --pill-border: rgba(15, 165, 166, 0.25);
    }

    body {
      width: {{ width }}px;
      height: {{ height }}px;
      background: #ffffff;
      color: var(--brand-slate);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* -------------------------------------------------------------
       FORMAT: PORTRAIT (4:5) and VERTICAL STORY (9:16)
       ------------------------------------------------------------- */
    .layout-vertical {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      justify-content: space-between;
    }

    .top-section {
      padding: 56px 64px 20px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 20;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      height: 52px;
      width: auto;
      object-fit: contain;
    }

    .kicker-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .kicker-rule {
      width: 44px;
      height: 1.5px;
      background: #94a3b8;
    }

    .kicker-text {
      font-family: 'Outfit', sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--brand-teal);
      text-transform: uppercase;
    }

    .headline {
      font-family: 'Anton', 'Outfit', sans-serif;
      font-size: {{ title_font_size }}px;
      font-weight: 900;
      line-height: 1.04;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      color: #050b14;
      max-width: 980px;
      margin-bottom: 16px;
    }

    .sub-copy {
      font-size: 21px;
      font-weight: 550;
      line-height: 1.4;
      color: var(--brand-text-muted);
      max-width: 820px;
      margin-bottom: 24px;
    }

    .cta-container {
      margin-bottom: 8px;
    }

    .cta-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #00c853; /* High-contrast saturated green/teal like reference */
      background: linear-gradient(135deg, #00d26a 0%, #0fa5a6 100%);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 16px 44px;
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(0, 210, 106, 0.35);
    }

    /* Hero Visual Area with Floating Badges */
    .hero-container {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .hero-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Floating Feature Badges anchored to composition */
    .feature-badge {
      position: absolute;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1.5px solid var(--pill-border);
      padding: 14px 22px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.15);
      z-index: 10;
    }

    .badge-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0fa5a6 0%, #0284c7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
    }

    .badge-text {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
    }

    .badge-pos-right-1 {
      top: 15%;
      right: 64px;
    }

    .badge-pos-right-2 {
      top: 36%;
      right: 74px;
    }

    .badge-pos-left-1 {
      top: 25%;
      left: 64px;
    }

    /* -------------------------------------------------------------
       FORMAT: LANDSCAPE (16:9 or 1.91:1)
       ------------------------------------------------------------- */
    .layout-landscape {
      display: flex;
      flex-direction: row;
      height: 100%;
      width: 100%;
    }

    .layout-landscape .left-pane {
      width: 54%;
      height: 100%;
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      z-index: 20;
    }

    .layout-landscape .brand-logo {
      height: 46px;
      margin-bottom: 24px;
    }

    .layout-landscape .headline {
      font-size: 44px;
      text-align: left;
      margin-bottom: 14px;
    }

    .layout-landscape .sub-copy {
      font-size: 18px;
      text-align: left;
      margin-bottom: 24px;
      max-width: 540px;
    }

    .layout-landscape .right-pane {
      width: 46%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .layout-landscape .hero-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .layout-landscape .badge-pos-right-1 {
      top: 20%;
      right: 36px;
    }

    .layout-landscape .badge-pos-right-2 {
      bottom: 20%;
      right: 36px;
    }
  </style>
</head>
<body>

  <!-- Dynamic Orientation Handler -->
  {% if height >= width %}
  <!-- VERTICAL LAYOUT (Portrait 4:5, Square 1:1, Story 9:16) -->
  <div class="layout-vertical">
    <div class="top-section">
      <div class="header-bar">
        <img src="{{ logo_data_uri }}" alt="InfiniteTech AI" class="brand-logo" />
      </div>

      <div class="kicker-wrapper">
        <div class="kicker-rule"></div>
        <div class="kicker-text">{{ header }}</div>
        <div class="kicker-rule"></div>
      </div>

      <h1 class="headline">{{ title }}</h1>
      <p class="sub-copy">{{ description }}</p>

      <div class="cta-container">
        <div class="cta-pill-btn">
          {{ call_to_action }}
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
      </div>
    </div>

    <div class="hero-container">
      <img src="{{ hero_image_data_uri }}" alt="Enterprise Engineering" class="hero-photo" />

      <!-- Floating Feature Badges -->
      <div class="feature-badge badge-pos-right-1">
        <div class="badge-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
          </svg>
        </div>
        <div class="badge-text">{{ bullet_1 }}</div>
      </div>

      <div class="feature-badge badge-pos-right-2">
        <div class="badge-icon-box" style="background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="badge-text">{{ bullet_2 }}</div>
      </div>

      {% if bullet_3 %}
      <div class="feature-badge badge-pos-left-1">
        <div class="badge-icon-box" style="background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
        <div class="badge-text">{{ bullet_3 }}</div>
      </div>
      {% endif %}
    </div>
  </div>

  {% else %}
  <!-- LANDSCAPE LAYOUT (LinkedIn 1.91:1, X / Twitter 16:9) -->
  <div class="layout-landscape">
    <div class="left-pane">
      <img src="{{ logo_data_uri }}" alt="InfiniteTech AI" class="brand-logo" />

      <div class="kicker-wrapper">
        <div class="kicker-rule"></div>
        <div class="kicker-text">{{ header }}</div>
      </div>

      <h1 class="headline">{{ title }}</h1>
      <p class="sub-copy">{{ description }}</p>

      <div class="cta-pill-btn">
        {{ call_to_action }}
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </div>
    </div>

    <div class="right-pane">
      <img src="{{ hero_image_data_uri }}" alt="Enterprise Engineering" class="hero-photo" />

      <div class="feature-badge badge-pos-right-1">
        <div class="badge-icon-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="badge-text">{{ bullet_1 }}</div>
      </div>

      <div class="feature-badge badge-pos-right-2">
        <div class="badge-icon-box" style="background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="badge-text">{{ bullet_2 }}</div>
      </div>
    </div>
  </div>
  {% endif %}

</body>
</html>
