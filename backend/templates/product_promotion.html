<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Anton&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --brand-teal: #0fa5a6;
      --brand-teal-light: #38bdf8;
      --brand-bg: #090e17;
      --card-bg: rgba(30, 41, 59, 0.7);
    }

    body {
      width: {{ width }}px;
      height: {{ height }}px;
      background: var(--brand-bg);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* -------------------------------------------------------------
       FORMAT: VERTICAL (Portrait 4:5, Square 1:1, Story 9:16)
       ------------------------------------------------------------- */
    .layout-vertical {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      justify-content: space-between;
      padding: 56px 64px 44px 64px;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      z-index: 10;
    }

    .logo-container {
      background: #ffffff;
      padding: 6px 14px;
      border-radius: 8px;
    }

    .brand-logo {
      height: 42px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .spotlight-pill {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 6px 16px;
      border-radius: 9999px;
    }

    .main-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
      z-index: 10;
    }

    .kicker {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--brand-teal);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .headline {
      font-family: 'Anton', 'Outfit', sans-serif;
      font-size: {{ title_font_size }}px;
      font-weight: 900;
      line-height: 1.05;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      color: #ffffff;
      max-width: 960px;
      margin-bottom: 14px;
    }

    .sub-copy {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.4;
      color: #94a3b8;
      max-width: 820px;
      margin-bottom: 22px;
    }

    .dashboard-preview {
      width: 100%;
      max-width: 960px;
      height: 460px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      margin-bottom: 24px;
    }

    .dashboard-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    /* Floating Feature Pills */
    .feature-pills-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 960px;
      margin-bottom: 28px;
    }

    .feature-pill {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .feat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00d26a;
      box-shadow: 0 0 10px #00d26a;
    }

    .feat-text {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .cta-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #00d26a 0%, #0fa5a6 100%);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 18px 48px;
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(0, 210, 106, 0.4);
    }

    /* -------------------------------------------------------------
       FORMAT: LANDSCAPE (16:9, 1.91:1)
       ------------------------------------------------------------- */
    .layout-landscape {
      display: flex;
      height: 100%;
      width: 100%;
    }

    .layout-landscape .left-pane {
      width: 52%;
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .layout-landscape .headline {
      font-size: 42px;
      text-align: left;
      margin-bottom: 12px;
    }

    .layout-landscape .sub-copy {
      font-size: 17px;
      text-align: left;
      margin-bottom: 24px;
      max-width: 500px;
    }

    .layout-landscape .right-pane {
      width: 48%;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .layout-landscape .dashboard-preview {
      width: 100%;
      height: 380px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  {% if height >= width %}
  <!-- VERTICAL LAYOUT -->
  <div class="layout-vertical">
    <div class="top-header">
      <div class="logo-container">
        <img src="{{ logo_data_uri }}" alt="InfiniteTech AI" class="brand-logo" />
      </div>
      <div class="spotlight-pill">PLATFORM CAPABILITIES</div>
    </div>

    <div class="main-section">
      <div class="kicker">{{ header }}</div>
      <h1 class="headline">{{ title }}</h1>
      <p class="sub-copy">{{ description }}</p>

      <div class="dashboard-preview">
        <img src="{{ dashboard_image_data_uri }}" alt="Product Architecture" class="dashboard-img" />
      </div>

      <div class="feature-pills-row">
        <div class="feature-pill">
          <div class="feat-dot"></div>
          <span class="feat-text">{{ bullet_1 }}</span>
        </div>
        <div class="feature-pill">
          <div class="feat-dot" style="background: #38bdf8; box-shadow: 0 0 10px #38bdf8;"></div>
          <span class="feat-text">{{ bullet_2 }}</span>
        </div>
        {% if bullet_3 %}
        <div class="feature-pill">
          <div class="feat-dot" style="background: #a855f7; box-shadow: 0 0 10px #a855f7;"></div>
          <span class="feat-text">{{ bullet_3 }}</span>
        </div>
        {% endif %}
      </div>

      <div class="cta-pill-btn">
        {{ call_to_action }}
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </div>
    </div>
  </div>

  {% else %}
  <!-- LANDSCAPE LAYOUT -->
  <div class="layout-landscape">
    <div class="left-pane">
      <div class="logo-container" style="margin-bottom: 20px;">
        <img src="{{ logo_data_uri }}" alt="InfiniteTech AI" class="brand-logo" />
      </div>
      <div class="kicker">{{ header }}</div>
      <h1 class="headline">{{ title }}</h1>
      <p class="sub-copy">{{ description }}</p>

      <div class="cta-pill-btn">
        {{ call_to_action }}
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </div>
    </div>

    <div class="right-pane">
      <div class="dashboard-preview">
        <img src="{{ dashboard_image_data_uri }}" alt="Product Architecture" class="dashboard-img" />
      </div>
    </div>
  </div>
  {% endif %}

</body>
</html>
