<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: {{ width }}px;
      height: {{ height }}px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 80px;
      position: relative;
    }
    .top-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 20px;
    }
    .kicker-tag {
      font-size: 18px;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #94a3b8;
    }
    .main-body {
      display: flex;
      flex-direction: column;
      gap: 32px;
      margin: auto 0;
    }
    .editorial-title {
      font-size: {{ title_font_size }}px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -1.5px;
      color: #ffffff;
      text-transform: capitalize;
    }
    .editorial-desc {
      font-size: 24px;
      line-height: 1.5;
      color: #cbd5e1;
      max-width: 880px;
      border-left: 4px solid #f59e0b;
      padding-left: 20px;
    }
    .numbered-bullets {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 10px;
    }
    .numbered-card {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      background: rgba(30, 41, 59, 0.4);
      padding: 16px 20px;
      border-radius: 8px;
    }
    .num-badge {
      font-size: 16px;
      font-weight: 800;
      color: #f59e0b;
      letter-spacing: 1px;
      padding-top: 2px;
    }
    .num-text {
      font-size: 20px;
      font-weight: 500;
      color: #f1f5f9;
      line-height: 1.35;
    }
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 2px solid rgba(255, 255, 255, 0.15);
      padding-top: 24px;
    }
    .editorial-cta {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: #f59e0b;
      color: #0f172a;
      padding: 18px 36px;
      border-radius: 6px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .editorial-badge {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="top-meta">
    <div class="kicker-tag">// {{ header }}</div>
    <div class="brand-title">INFINITETECH AI &bull; EXECUTIVE REPORT</div>
  </div>

  <div class="main-body">
    <h1 class="editorial-title">{{ title }}</h1>
    <p class="editorial-desc">{{ description }}</p>

    <div class="numbered-bullets">
      {% for bullet in bullet_points %}
      <div class="numbered-card">
        <div class="num-badge">0{{ loop.index }}</div>
        <div class="num-text">{{ bullet }}</div>
      </div>
      {% endfor %}
    </div>
  </div>

  <div class="bottom-bar">
    <div class="editorial-cta">
      {{ call_to_action }}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </div>
    <div class="editorial-badge">Enterprise Edition &bull; Strategic Roadmap</div>
  </div>
</body>
</html>
